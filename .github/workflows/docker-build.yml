name: Build and Push Images

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/holbok-peti/laravel:latest ./backend

      - name: Push backend image
        run: docker push ghcr.io/holbok-peti/laravel:latest

      - name: Build frontend image
        run: docker build -t ghcr.io/holbok-peti/angular:latest ./frontend

      - name: Push frontend image
        run: docker push ghcr.io/holbok-peti/angular:latest